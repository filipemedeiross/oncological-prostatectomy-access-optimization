      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "ab01d2ae0b9b49b77b6481851e40d2b9", "console": [], "id": "Hbol", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"capacity-constrained-reallocation\"\u003ECAPACITY-CONSTRAINED REALLOCATION\u003C/h1\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "2a34f0f87b275292e66832d020a0fb4c", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EScenario 2 \u00b7 Oncological prostatectomy \u00b7 Brazil \u00b7 January\u2013June 2026.\u003C/strong\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EReallocate the observed admissions among the same provider municipalities. Observed production is a capacity proxy; expansion is hypothetical and applied to each provider separately.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "c444b8dcdb5f1e78c8cdec58f2ca33f1", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "f46f34d90b9cf5032557dbccc58f655f", "console": [], "id": "bkHC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "507fffbdbcef162d4666b51b4e788a4b", "console": [], "id": "lEQa", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "0d8790cb272268cfc49ffccc9ffed767", "console": [], "id": "PKri", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "06408cfda6bc4cbdf72e4972174d9572", "console": [], "id": "Xref", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"model-and-distances\"\u003EMODEL AND DISTANCES\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b6d409c38f1e704e938f5168d9109da5", "console": [], "id": "SFPL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EFor origin demand \u003Cmarimo-tex class=\"arithmatex\"\u003E||(D_i||)\u003C/marimo-tex\u003E, observed provider production \u003Cmarimo-tex class=\"arithmatex\"\u003E||(U_j^{obs}||)\u003C/marimo-tex\u003E and slack \u003Cmarimo-tex class=\"arithmatex\"\u003E||(s||)\u003C/marimo-tex\u003E:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\min_x \\sum_{i,j}\\tilde d_{ij}x_{ij},\\qquad\n\\sum_j x_{ij}=D_i,\\qquad\n\\sum_i x_{ij}\\leq\\lfloor(1+s)U_j^{obs}\\rfloor,\\qquad x_{ij}\\geq0.\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThe compact instance supplies demand, production and \u003Cstrong\u003Erounded integer kilometres\u003C/strong\u003E \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\tilde d_{ij}=\\lfloor d_{ij}\\rfloor||)\u003C/marimo-tex\u003E. The transportation LP has integral margins; HiGHS simplex yields an integral basic solution, checked before export.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "85b0a0cef165885d4c962e3718838e83", "console": [], "id": "BYtC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "d4b6fcfebea56ce013e9cbfd04d4754c", "console": [], "id": "RGSE", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-progress data-title='\u0026quot;Solving capacity scenarios\u0026quot;' data-total='41' data-progress='41' data-rate='0.26495990868613095' data-eta='0.0'\u003E\u003C/marimo-progress\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "6d892b9896e6128e31d910bb71e96f25", "console": [], "id": "Kclp", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"gains-and-descriptive-elbow\"\u003EGAINS AND DESCRIPTIVE ELBOW\u003C/h2\u003E\u003C/span\u003E"}, "type"
