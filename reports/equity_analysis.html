      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

changed_origins\u0026quot;,[\u0026quot;integer\u0026quot;,\u0026quot;int64\u0026quot;]],[\u0026quot;worsened_origins\u0026quot;,[\u0026quot;integer\u0026quot;,\u0026quot;int64\u0026quot;]]]' data-show-filters='true' data-show-download='true' data-show-search='true' data-show-column-summaries='false' data-show-data-types='true' data-show-page-size-selector='false' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers='[]' data-hidden-columns='[]' data-has-stable-row-id='false' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "52b1b02011cffba44fa0f1ebe87f26f4", "console": [], "id": "ZHCJ", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"efficiencyequity-frontier\"\u003EEFFICIENCY\u2013EQUITY FRONTIER\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "63dab7dccb875b7f0cc22436b4e895c9", "console": [], "id": "ROlb", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThis experiment investigates \u003Cstrong\u003Ehow much the worst municipal mean travel distance can be reduced by allowing a controlled increase in total national travel distance\u003C/strong\u003E. For each tolerance \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\varepsilon||)\u003C/marimo-tex\u003E, a distance budget is imposed relative to the optimal cost of the original CAP model, \u003Cmarimo-tex class=\"arithmatex\"\u003E||(C^*||)\u003C/marimo-tex\u003E:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nC(x)\\leq\\lfloor(1+\\varepsilon)C^*\\rfloor.\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EOptimization proceeds in two stages:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003E\u003Cstrong\u003EEquity (minimax):\u003C/strong\u003E Minimize the largest mean travel distance across municipalities of origin:\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\min_x\\max_i\\left(\\frac{\\sum_j d_{ij}x_{ij}}{D_i}\\right).\n||]\u003C/marimo-tex\u003E\u003Col start=\"2\"\u003E\n\u003Cli\u003E\u003Cstrong\u003EEfficiency:\u003C/strong\u003E Preserve the optimal minimax value (within a tolerance of \u003Cmarimo-tex class=\"arithmatex\"\u003E||(10^{-5}||)\u003C/marimo-tex\u003E km) while minimizing total national travel distance to avoid unnecessary additional travel.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EKey cases:\u003C/strong\u003E\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\varepsilon=0||)\u003C/marimo-tex\u003E:\u003C/strong\u003E Examines whether alternative distance-optimal allocations provide better territorial equity without sacrificing efficiency.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\varepsilon\u0026gt;0||)\u003C/marimo-tex\u003E:\u003C/strong\u003E Allows a controlled efficiency loss to reduce the worst municipal mean travel distance.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EWithout municipal protection:\u003C/strong\u003E Some municipalities may experience increased travel distances because the objective is to minimize the worst municipal mean rather than guarantee individual municipal improvements.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b67259ce1ead017991d87f2393cef9d2", "console": [], "id": "qnkX", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='qnkX-0' random-id='93ed7b32-e4a3-3583-1b76-2000b5275715'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;epsilon\u0026#92;\u0026quot;:0.0,\u0026#92;\u0026quot;budget_km\u0026#92;\u0026quot;:86902,\u0026#92;\u0026quot;total_distance_km\u0026#92;\u0026
