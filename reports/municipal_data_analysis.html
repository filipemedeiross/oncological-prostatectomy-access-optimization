    <script data-marimo="true">
      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "a9a7fc389c47e5151bc586c8d38912d4", "console": [], "id": "Hbol", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"observed-municipal-demand-and-supply\"\u003EOBSERVED MUNICIPAL DEMAND AND SUPPLY\u003C/h1\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b19e8d8932d29682d6614328aa2b878c", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EOncological prostatectomy \u00b7 Brazil \u00b7 January\u2013June 2026.\u003C/strong\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe unit of analysis is the hospitalization (AIH and CNES), not the individual patient. \u003Cstrong\u003EDemand\u003C/strong\u003E counts hospitalizations by municipality of residence without estimating clinical need; \u003Cstrong\u003Eobserved supply\u003C/strong\u003E counts hospitalizations by municipality of care without measuring installed capacity. Local care is included in both totals. Observed flows represent actual care delivery.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "e07fbad9fe5591564f329f19c7feacb3", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "503068dd6b4abf426c7f82c78640ea41", "console": [], "id": "bkHC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "1ffd3c154cd2a17d61c11fe67aea674c", "console": [], "id": "lEQa", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "a83b1c02b9a943f31d8d43dc0ef1df71", "console": [], "id": "PKri", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "764f71fe8622036957d74823e4c34b10", "console": [], "id": "Xref", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe methodology uses simplified municipal geometries from IBGE, projection to \u003Cstrong\u003EEPSG:5880\u003C/strong\u003E, centroid calculation, and transformation to \u003Cstrong\u003EEPSG:4674\u003C/strong\u003E. Centroids represent municipalities, not patient addresses, hospital locations, or necessarily municipal administrative centers. The cache in \u003Ccode\u003E.cache/ibge/\u003C/code\u003E is reused; only missing files are downloaded.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a85118cadf5ab66149181523225dade1", "console": [], "id": "SFPL", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "16c29a838396743474a4f914d07ac0af", "console": [], "id": "BYtC", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003E810 municipalities validated.\u003C/strong\u003ECSV: \u003Ccode\u003Edata/municipal_data_2026_first_half.csv\u003C/code\u003E.\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='BYtC-0' random-id='3039c95b-c143-023d-eef6-127e65d43fb7'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eExported municipal data\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-data='\u0026quot;[{\u0026#92;\u0026quot;municipality_code\u0026#92;\u0026quot;:\u0026#92;\u0026quot;1100049\u0026#92;\u0026quot;,\u0026#92;\u0026quot;municipality\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Cacoal\u0026#92;\u0026quot;,\u0026#92;\u0026quot;state_code\u0026#92;\u0026quot;:\
