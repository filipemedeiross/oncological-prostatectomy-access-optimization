    <script data-marimo="true">
      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

am.gov.br/2026/08/transporte-universitario-tefe-novos-horarios/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EMunicipality of Alvar\u00e3es\u003C/a\u003E documents bus transportation to Nogueira and boat transportation between Nogueira and Tef\u00e9. Using Alvar\u00e3es as a proxy does not account for the river crossing, transfers, or waiting times and does not represent patients' actual travel.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe Autazes proxy is a territorial approximation based on the AM-254/BR-319 connection documented by the \u003Ca href=\"https://www.agenciaamazonas.am.gov.br/noticias/governador-wilson-lima-assina-ordens-de-servico-para-recuperacao-da-am-254-e-obras-do-sistema-viario-em-autazes/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EGovernment of Amazonas\u003C/a\u003E. The \u003Ca href=\"https://defensoria.am.def.br/2024/05/06/dpe-am-investiga-interrupcao-do-transporte-escolar-para-alunos-da-zona-rural-de-careiro-castanho/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EDPE-AM\u003C/a\u003E also identifies stretches of the Estrada de Autazes in rural Careiro in May 2024. Using Careiro\u2013destination estimates does not add access from Autazes to the proxy network or account for differences in crossings, transfers, and waiting times; it does not represent patients' actual travel. Both sources were accessed on \u003Cstrong\u003EOctober 30, 2026\u003C/strong\u003E; distances and times still come from the May 2024 Saldanha matrix.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EMoju\u00ed dos Campos \u2192 Santar\u00e9m is not assigned the proxy's zero diagonal distance.\u003C/strong\u003E For this specific pair, we use \u003Cstrong\u003E33.3 km and 30 minutes by car\u003C/strong\u003E, according to \u003Ca href=\"https://www.rome2rio.com/s/Moju%C3%AD-dos-Campos/Santar%C3%A9m\" rel=\"noopener noreferrer\" target=\"_blank\"\u003ERome2Rio, Moju\u00ed dos Campos \u2192 Santar\u00e9m\u003C/a\u003E, accessed on \u003Cstrong\u003EOctober 22, 2026\u003C/strong\u003E.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "39dbc694a2992185c8beb78530b0fa4a", "console": [], "id": "Kclp", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "3046a875382caf2c594489a20565e876", "console": [], "id": "emfo", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "e890fd25b175bcd130c4a67775873320", "console": [], "id": "Hstk", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "3beeb50f3c1703562af56b1c0d947b73", "console": [], "id": "nWHF", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='nWHF-0' random-id='fffb5c20-91a5-f615-c203-30999f598304'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eCoverage before and after imputation\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-data='\u0026quot;[{\u0026#92;\u0026quot;stage\u0026#92;\u0026quot;:\u0026#92;\u0026quot;before\u0026#92;\u0026quot;,\u0026#92;\u0026quot;pairs\u0026#92;\u0026quot;:123872,\u0026#92;\u0026quot;coverage_pct\u0026#92;\u0026quot;:99.74489795918367,\u0026#92;\u0026quot;estimated_pairs\u0026#92;\u0026quot;:123556,\u0026#92;\u0026quot;pending_pairs\u0026#92;\u0026quot;:316,\u0026#92;\u0026quot;pending_admissions\u0026#92;\u0026quot;:2},{\u0026#92;\u0026quot;stage\u0026#92;\u0026quot;:\u0026#92;\u0026quot;after\u0026#92;\u0026quot;,\u0026#92;\u0026quot;pairs\u0026#92;\u0026quot;:123872,\u0026#92;\u0026quot;coverage_pct\u0026#92;\u0026quot;:100.0,\u0026#92;\u0026quot;estimated_pairs\u0026#92
