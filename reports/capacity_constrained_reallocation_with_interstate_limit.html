      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }

305d473cae0e51e3", "console": [], "id": "SFPL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EFor demand \u003Cmarimo-tex class=\"arithmatex\"\u003E||(D_i||)\u003C/marimo-tex\u003E, observed production \u003Cmarimo-tex class=\"arithmatex\"\u003E||(U_j^{obs}||)\u003C/marimo-tex\u003E, capacity slack \u003Cmarimo-tex class=\"arithmatex\"\u003E||(s||)\u003C/marimo-tex\u003E, interstate share \u003Cmarimo-tex class=\"arithmatex\"\u003E||(q||)\u003C/marimo-tex\u003E and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N=\\sum_iD_i||)\u003C/marimo-tex\u003E:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{aligned}\n\\min_x\\quad \u0026amp;\\sum_{i,j}\\tilde d_{ij}x_{ij}\\\\\n\\text{subject to}\\quad\n\u0026amp;\\sum_jx_{ij}=D_i,\\qquad\\\\\n\u0026amp;\\sum_ix_{ij}\\leq\\lfloor(1+s)U_j^{obs}\\rfloor,\\\\\n\u0026amp;\\sum_{(i,j):\\,state(i)\\ne state(j)}x_{ij}\\leq\\lfloor qN\\rfloor,\\\\\n\u0026amp;\\qquad x_{ij}\\in\\mathbb Z_{\\geq0}.\n\\end{aligned}\n||]\u003C/marimo-tex\u003E\u003Cblockquote\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ENotes\u003C/strong\u003E.: HiGHS solves the integer model using the compact instance's \u003Cstrong\u003Erounded integer kilometres\u003C/strong\u003E \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\tilde d_{ij}||)\u003C/marimo-tex\u003E. Reported distances use the original OD values.\u003C/span\u003E\n\u003C/blockquote\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "7afb10bb0ea93c15cde307078ad7b93b", "console": [], "id": "BYtC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "041f894f054e698e48a6d5c0169d1b4d", "console": [], "id": "RGSE", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "859dd5aaf76660a8244967696e63aadf", "console": [], "id": "Kclp", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-inver
